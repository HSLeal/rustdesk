name: Compilar Suporte Grupo Etica

on:
  workflow_dispatch:
    inputs:
      rendezvous_server:
        description: 'Host/IP do servidor VPS (opcional se configurado em secrets/vars)'
        required: false
        type: string
      rs_pub_key:
        description: 'Chave pública RS_PUB_KEY (opcional se configurado em secrets/vars)'
        required: false
        type: string
      api_server:
        description: 'Servidor API (opcional se configurado em secrets/vars)'
        required: false
        type: string
      permanent_password:
        description: 'Senha permanente (opcional se configurado em secrets/vars)'
        required: false
        type: string
      preset_username:
        description: 'Usuário do painel para Windows (opcional se configurado em secrets/vars)'
        required: false
        type: string
      preset_device_group:
        description: 'Grupo de dispositivos do painel para Windows (opcional se configurado em secrets/vars)'
        required: false
        type: string

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      rendezvous_server: ${{ inputs.rendezvous_server || '' }}
      rs_pub_key: ${{ inputs.rs_pub_key || '' }}
      api_server: ${{ inputs.api_server || '' }}
      permanent_password: ${{ inputs.permanent_password || '' }}
      preset_username: ${{ inputs.preset_username || '' }}
      preset_device_group: ${{ inputs.preset_device_group || '' }}
